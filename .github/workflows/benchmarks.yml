name: benchmarks

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run benchmark
        env:
          BENCHMARK_TAG: ${{ github.ref_name }}
        run: python benchmarks/bench_latency.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results.json benchmarks/results/
          git diff --cached --quiet || git commit -m "chore: benchmark results for ${{ github.ref_name }}"
          git push
