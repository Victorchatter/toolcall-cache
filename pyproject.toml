[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-cache"
version = "0.3.0"
description = "A local, content-addressed cache for MCP tool results."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Victor"}]
requires-python = ">=3.10"
keywords = ["mcp", "cache", "agent", "tools", "proxy", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
toolcall-cache = "toolcall_cache.cli:main"

[project.urls]
Homepage = "https://github.com/Victorchatter/toolcall-cache"
Repository = "https://github.com/Victorchatter/toolcall-cache"
Issues = "https://github.com/Victorchatter/toolcall-cache/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
